[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aromma-mcp"
version = "0.2.0"
description = "FastMCP server with LanceDB vector cache for AROMMA odor prediction and scent modulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "torch>=2.4.0",
    "transformers==4.30.1",
    "peft==0.7.0",
    "lancedb>=0.17.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]

[project.scripts]
aromma-mcp = "aromma_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
